parameters:
  - name: workingDirectory
    type: string
  - name: artifactName
    type: string
    default: nextjs-build
  - name: appVersion
    type: string
    default: 0.0.0.0-local

steps:
  - script: npm run lint
    displayName: npm run lint
    workingDirectory: $(Build.SourcesDirectory)/${{ parameters.workingDirectory }}

  - script: npm run build
    displayName: npm run build
    workingDirectory: $(Build.SourcesDirectory)/${{ parameters.workingDirectory }}
    env:
      APP_VERSION: ${{ parameters.appVersion }}
      NEXT_PUBLIC_APP_VERSION: ${{ parameters.appVersion }}

  - task: PublishPipelineArtifact@1
    displayName: Publish build output
    inputs:
      targetPath: $(Build.SourcesDirectory)/${{ parameters.workingDirectory }}
      artifact: ${{ parameters.artifactName }}
      publishLocation: pipeline
