# Calculates Major.Minor.Patch.Revision via GitVersion and exports pipeline outputs
# for later stages (ACR tags, auto-tag, Docker, Node stamp).
#
# GitTools Azure DevOps task names: gitversion-setup / gitversion-execute (v4).
# v4.7+ requires GitVersion >=6.2.0 <7.0.0.

steps:
  - task: gitversion-setup@4
    displayName: Install GitVersion
    inputs:
      versionSpec: '6.2.x'

  - task: gitversion-execute@4
    displayName: Calculate version
    inputs:
      useConfigFile: true
      configFilePath: GitVersion.yml

  # Compose four-part appVersion from GitVersion JSON (not ADO macros).
  # Under TrunkBased/Mainline, CommitsSinceVersionSource is often 0 because the
  # patch was already incremented; PreReleaseNumber carries the commit counter
  # on PR/feature branches when GitVersion sets it. Revision preference:
  #   1) PreReleaseNumber when > 0
  #   2) CommitsSinceVersionSource when > 0
  #   3) else 0 (clean trunk / tagged release / ADO PR merge refs where both are 0)
  - bash: |
      set -euo pipefail

      if ! command -v dotnet-gitversion >/dev/null 2>&1; then
        echo "##vso[task.logissue type=error]dotnet-gitversion not on PATH; gitversion-setup must run first"
        exit 1
      fi

      GV_JSON="$(dotnet-gitversion /config GitVersion.yml /output json)"
      echo "GitVersion JSON:"
      echo "${GV_JSON}"

      MAJOR="$(echo "${GV_JSON}" | jq -r '.Major')"
      MINOR="$(echo "${GV_JSON}" | jq -r '.Minor')"
      PATCH="$(echo "${GV_JSON}" | jq -r '.Patch')"
      TAG_VERSION="$(echo "${GV_JSON}" | jq -r '.MajorMinorPatch')"
      COMMITS="$(echo "${GV_JSON}" | jq -r '.CommitsSinceVersionSource // 0')"
      PRE_RELEASE="$(echo "${GV_JSON}" | jq -r '.PreReleaseNumber // 0')"

      if [ -z "$MAJOR" ] || [ "$MAJOR" = "null" ] || \
         [ -z "$MINOR" ] || [ "$MINOR" = "null" ] || \
         [ -z "$PATCH" ] || [ "$PATCH" = "null" ] || \
         [ -z "$TAG_VERSION" ] || [ "$TAG_VERSION" = "null" ]; then
        echo "##vso[task.logissue type=error]GitVersion JSON missing Major/Minor/Patch/MajorMinorPatch"
        exit 1
      fi

      if [ "$PRE_RELEASE" = "null" ] || [ -z "$PRE_RELEASE" ]; then
        PRE_RELEASE=0
      fi
      if [ "$COMMITS" = "null" ] || [ -z "$COMMITS" ]; then
        COMMITS=0
      fi

      if [ "$PRE_RELEASE" -gt 0 ]; then
        REVISION="$PRE_RELEASE"
      elif [ "$COMMITS" -gt 0 ]; then
        REVISION="$COMMITS"
      else
        REVISION=0
      fi

      APP_VERSION="${MAJOR}.${MINOR}.${PATCH}.${REVISION}"
      SHORT_SHA="$(echo "${BUILD_SOURCEVERSION}" | cut -c1-7)"

      echo "PreReleaseNumber=${PRE_RELEASE} CommitsSinceVersionSource=${COMMITS} -> Revision=${REVISION}"
      echo "appVersion=${APP_VERSION}"
      echo "appVersionTag=${TAG_VERSION}"
      echo "shortSha=${SHORT_SHA}"

      echo "##vso[task.setvariable variable=appVersion]${APP_VERSION}"
      echo "##vso[task.setvariable variable=appVersionTag]${TAG_VERSION}"
      echo "##vso[task.setvariable variable=shortSha]${SHORT_SHA}"

      echo "##vso[task.setvariable variable=appVersion;isOutput=true]${APP_VERSION}"
      echo "##vso[task.setvariable variable=appVersionTag;isOutput=true]${TAG_VERSION}"
      echo "##vso[task.setvariable variable=shortSha;isOutput=true]${SHORT_SHA}"
    name: SetAppVersion
    displayName: Export appVersion outputs
    env:
      BUILD_SOURCEVERSION: $(Build.SourceVersion)
