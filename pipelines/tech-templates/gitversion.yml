# Calculates Major.Minor.Patch.Revision via GitVersion and exports pipeline outputs
# for later stages (ACR tags, auto-tag, Docker, Node stamp).
#
# GitTools Azure DevOps task names: gitversion-setup / gitversion-execute (v4).
# v4.7+ requires GitVersion >=6.2.0 <7.0.0.

steps:
  - task: gitversion-setup@4
    displayName: Install GitVersion
    inputs:
      versionSpec: '6.2.x'

  - task: gitversion-execute@4
    displayName: Calculate version
    inputs:
      useConfigFile: true
      configFilePath: GitVersion.yml

  # Compose four-part appVersion and expose cross-stage outputs.
  # Revision = CommitsSinceVersionSource (GitVersion 6.2 does not export
  # VersionSourceDistance; missing ADO macros expand to the literal $(...) text).
  - bash: |
      set -euo pipefail

      # Reject unexpanded Azure DevOps macros like $(GitVersion_Foo)
      is_macro() {
        case "${1:-}" in
          *'$(GitVersion'*|*'$(Build.'*) return 0 ;;
          *) return 1 ;;
        esac
      }

      MAJOR="${GITVERSION_MAJOR:-}"
      MINOR="${GITVERSION_MINOR:-}"
      PATCH="${GITVERSION_PATCH:-}"
      TAG_VERSION="${GITVERSION_MAJOR_MINOR_PATCH:-}"
      REVISION="${GITVERSION_COMMITS_SINCE_VERSION_SOURCE:-0}"

      if is_macro "$MAJOR" || is_macro "$MINOR" || is_macro "$PATCH" || is_macro "$TAG_VERSION"; then
        echo "##vso[task.logissue type=error]GitVersion macros did not expand (got literal \$(GitVersion_*) values)"
        echo "MAJOR='${MAJOR}' MINOR='${MINOR}' PATCH='${PATCH}' TAG='${TAG_VERSION}'"
        exit 1
      fi

      if is_macro "$REVISION" || [ -z "$REVISION" ]; then
        REVISION="0"
      fi

      if [ -z "$MAJOR" ] || [ -z "$MINOR" ] || [ -z "$PATCH" ] || [ -z "$TAG_VERSION" ]; then
        echo "##vso[task.logissue type=error]GitVersion variables missing after execute"
        echo "MAJOR='${MAJOR}' MINOR='${MINOR}' PATCH='${PATCH}' TAG='${TAG_VERSION}'"
        exit 1
      fi

      APP_VERSION="${MAJOR}.${MINOR}.${PATCH}.${REVISION}"
      SHORT_SHA="$(echo "${BUILD_SOURCEVERSION}" | cut -c1-7)"

      echo "appVersion=${APP_VERSION}"
      echo "appVersionTag=${TAG_VERSION}"
      echo "shortSha=${SHORT_SHA}"

      echo "##vso[task.setvariable variable=appVersion]${APP_VERSION}"
      echo "##vso[task.setvariable variable=appVersionTag]${TAG_VERSION}"
      echo "##vso[task.setvariable variable=shortSha]${SHORT_SHA}"

      echo "##vso[task.setvariable variable=appVersion;isOutput=true]${APP_VERSION}"
      echo "##vso[task.setvariable variable=appVersionTag;isOutput=true]${TAG_VERSION}"
      echo "##vso[task.setvariable variable=shortSha;isOutput=true]${SHORT_SHA}"
    name: SetAppVersion
    displayName: Export appVersion outputs
    env:
      GITVERSION_MAJOR: $(GitVersion_Major)
      GITVERSION_MINOR: $(GitVersion_Minor)
      GITVERSION_PATCH: $(GitVersion_Patch)
      GITVERSION_MAJOR_MINOR_PATCH: $(GitVersion_MajorMinorPatch)
      GITVERSION_COMMITS_SINCE_VERSION_SOURCE: $(GitVersion_CommitsSinceVersionSource)
      BUILD_SOURCEVERSION: $(Build.SourceVersion)
