# Updates an existing Azure Container App to an image already in ACR.
# OOTB AzureContainerApps@1 — does not build, does not use CI image tarballs.

parameters:
  - name: azureServiceConnection
    type: string
  - name: containerAppName
    type: string
  - name: resourceGroup
    type: string

steps:
  - bash: |
      set -euo pipefail
      if [ -z "${ACR_LOGIN_SERVER:-}" ] || [ -z "${IMAGE_REPOSITORY:-}" ] || [ -z "${APP_VERSION:-}" ]; then
        echo "##vso[task.logissue type=error]acrLoginServer/imageRepository/appVersion empty; cannot resolve ACR image"
        exit 1
      fi
      if [ -z "${ACR_NAME:-}" ]; then
        echo "##vso[task.logissue type=error]acrName is empty after App Configuration export"
        exit 1
      fi

      IMAGE="${ACR_LOGIN_SERVER}/${IMAGE_REPOSITORY}:${APP_VERSION}"
      echo "Deploying ${IMAGE} to Container App"
      echo "##vso[task.setvariable variable=imageToDeploy]${IMAGE}"
    displayName: Resolve ACR image reference
    env:
      ACR_LOGIN_SERVER: $(acrLoginServer)
      ACR_NAME: $(acrName)
      IMAGE_REPOSITORY: $(imageRepository)
      APP_VERSION: $(appVersion)

  - task: AzureContainerApps@1
    displayName: Deploy Container App from ACR
    inputs:
      azureSubscription: ${{ parameters.azureServiceConnection }}
      containerAppName: ${{ parameters.containerAppName }}
      resourceGroup: ${{ parameters.resourceGroup }}
      imageToDeploy: $(imageToDeploy)
      acrName: $(acrName)
