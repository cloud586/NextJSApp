# Trunk-based versioning for nextjsapp (GitVersion 6+).
# Canonical artifact/runtime version: Major.Minor.Patch.Revision
#   Revision = VersionSourceDistance (commits since version source; 0 on tagged trunk).
# Git tags remain three-part: vMajor.Minor.Patch
#
# Bump intent on merge commits / PR titles: +semver: major|minor|patch (default Patch).
#
# mode: Mainline was removed in GitVersion 6 — use TrunkBased workflow instead.

workflow: TrunkBased/preview1
next-version: 0.1.0

assembly-file-versioning-format: '{Major}.{Minor}.{Patch}.{VersionSourceDistance}'
assembly-versioning-format: '{Major}.{Minor}.{Patch}.{VersionSourceDistance}'

branches:
  main:
    regex: ^main$
    increment: Patch
    label: ''
    is-main-branch: true
    source-branches: []
  pull-request:
    regex: ^(pull|pull\-requests|pr)[/-]
    label: pullrequest
    increment: Inherit
    label-number-pattern: '[/-](?<number>\d+)[-/]'
    source-branches:
      - main

ignore:
  sha: []
